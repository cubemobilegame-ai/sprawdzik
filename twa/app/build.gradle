plugins { id "com.android.application" }

def host = "sprawdzik2.vercel.app"

android {
    namespace "com.cubemobilegames.eduskan"
    compileSdk 36
    defaultConfig {
        applicationId "com.cubemobilegames.eduskan"
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName (System.getenv("VERSION_NAME") ?: "1.0.0")
        resValue "string", "hostName", host
        resValue "string", "launchUrl", "https://" + host + "/"
        resValue "string", "providerAuthority", "com.cubemobilegames.eduskan.fileprovider"
        resValue "string", "assetStatements", '[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\"}}]'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
