name: EduSkan – Android

on:
  push:
    branches: [main]
    paths: ["android-app/**", "index.html", "cube-mobile-apps-intro.mp4", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Licencje Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pliki aplikacji (www)
        working-directory: android-app
        run: |
          mkdir -p www
          cp ../index.html ../cube-mobile-apps-intro.mp4 ../icon-180.png ../icon-512.png ../manifest.json www/
          ls -la www

      - name: Capacitor i wtyczki
        working-directory: android-app
        run: |
          CAPV=$(npm view @capacitor-community/text-to-speech@latest peerDependencies --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let p={};try{p=JSON.parse(s)}catch(e){};const v=(p["@capacitor/core"]||"").match(/(\d+)/);console.log(v?v[1]:"latest")})')
          echo "Capacitor $CAPV"
          npm install --no-audit --no-fund @capacitor/core@$CAPV @capacitor/cli@$CAPV @capacitor/android@$CAPV @capacitor/filesystem@$CAPV @capacitor/share@$CAPV @capacitor-community/text-to-speech@latest 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          npx cap add android 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Ikony, aparat, wersja
        working-directory: android-app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: VERSION_NAME="$(cat version.txt)" node patch-android.mjs 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Synchronizacja
        working-directory: android-app
        run: npx cap sync android 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Zbuduj AAB i APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Podpisz i sprawdź
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          V="$(cat android-app/version.txt)"
          AAB=android-app/android/app/build/outputs/bundle/release/app-release.aab
          APK=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unzip -p "$AAB" base/assets/public/index.html > /tmp/i.html; grep -q EDU_I18N /tmp/i.html && echo "OK: aplikacja w AAB (9 jezykow)"
          unzip -l "$AAB" | grep -E "capacitor.plugins.json|AndroidManifest" | head
          mkdir -p wynik
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
            cp "$AAB" "wynik/eduskan-$V.aab"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" "wynik/eduskan-$V.aab" eduskan
            jarsigner -verify "wynik/eduskan-$V.aab"
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks upload.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias eduskan --out "wynik/eduskan-$V.apk" aligned.apk
            "$BT/apksigner" verify --print-certs "wynik/eduskan-$V.apk" | head -3
            rm -f upload.jks aligned.apk
            echo "PODPISANE=tak" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretow KEYSTORE_BASE64 / KEYSTORE_PASSWORD – pliki niepodpisane"
            cp "$AAB" wynik/eduskan-unsigned.aab
            cp "$APK" wynik/eduskan-unsigned.apk
            cp "$BT/lib/apksigner.jar" wynik/apksigner.jar
            echo "PODPISANE=nie" >> "$GITHUB_ENV"
          fi
          ls -la wynik

      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat android-app/version.txt)"
          gh release create "android-$V-${{ github.run_number }}" wynik/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "EduSkan Android $V (kompilacja ${{ github.run_number }})" \
            --notes "AAB do Sklepu Play i APK do instalacji na telefonie (versionCode ${{ github.run_number }}, podpisane: $PODPISANE)."

      - name: Log błędu do Releases
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log; tail -c 300000 build.log > build-error.log
          gh release create "android-error-${{ github.run_number }}" build-error.log --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Błąd budowania ${{ github.run_number }}" --notes "Log błędu"
