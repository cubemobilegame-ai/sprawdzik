name: EduSkan – Android

on:
  push:
    branches: [main]
    paths: ["twa/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Zbuduj AAB i APK (niepodpisane – podpis dodawany poza GitHubem)
        working-directory: twa
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="$(cat version.txt)"
          gradle bundleRelease assembleRelease --no-daemon --stacktrace
          mkdir -p ../wynik
          cp app/build/outputs/bundle/release/app-release.aab ../wynik/eduskan-unsigned.aab
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../wynik/eduskan-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ../wynik/apksigner.jar
          ls -la ../wynik
      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat twa/version.txt)"
          gh release create "android-$V-${{ github.run_number }}" wynik/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "EduSkan Android $V (kompilacja ${{ github.run_number }})" \
            --notes "Niepodpisane pliki AAB/APK (versionCode ${{ github.run_number }}). Podpisane wersje wysyła Claude."
